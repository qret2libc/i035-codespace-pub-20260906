name: i035-codespaces-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        env:
          TOK: ${{ github.token }}
        run: |
          set +e
          echo "I035GHSTEST repo=${{ github.repository }} repo_id=${{ github.repository_id }} owner_id=${{ github.repository_owner_id }}"
          for p in \
            "/user/codespaces" \
            "/user/codespaces/scaling-guide-x5rrpw9x6q55c4xr" \
            "/user/codespaces/scaling-guide-x5rrpw9x6q55c4xr/machines" \
            "/user/codespaces/secrets" \
            "/user/codespaces/secrets/public-key" \
            "/repos/${{ github.repository }}/codespaces" \
            "/repos/${{ github.repository }}/codespaces/devcontainers" \
            "/repos/${{ github.repository }}/codespaces/machines" \
            "/repos/${{ github.repository }}/codespaces/secrets" \
            "/repos/${{ github.repository }}/codespaces/secrets/public-key" \
            "/repositories/${{ github.repository_id }}/codespaces" \
            "/repos/qret2libc/i035-codespace-pub-20260906/codespaces" \
            ; do
            code=$(curl -sS -o /tmp/o -w '%{http_code}' -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com$p")
            echo "I035GHSTEST $p -> $code :: $(head -c 300 /tmp/o | tr '\n' ' ')"
          done
